services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXDEPLOY_ENCRYPTION_KEY: ${NEXDEPLOY_ENCRYPTION_KEY}
      WRANGLER_WRITE_LOGS: "false"
    ports:
      - "127.0.0.1:${PANEL_PORT:-3000}:3000"
    volumes:
      - panel-state:/app/.wrangler
    depends_on:
      - executor
    networks:
      - nexdeploy-internal

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN}
      PROJECTS_DIR: /opt/nexdeploy/projects
    volumes:
      - executor-projects:/opt/nexdeploy/projects
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexdeploy-internal

volumes:
  panel-state:
  executor-projects:

networks:
  nexdeploy-internal:
    internal: true
