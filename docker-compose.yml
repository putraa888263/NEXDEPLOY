services:
  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NEXDEPLOY_ENCRYPTION_KEY: ${NEXDEPLOY_ENCRYPTION_KEY}
      NEXA_SERVICE_SECRET: ${NEXA_SERVICE_SECRET}
      WRANGLER_WRITE_LOGS: "false"
    ports:
      - "10.90.100.3:${PANEL_PORT:-8088}:3000"
    volumes:
      - panel-state:/app/.wrangler
    depends_on:
      - executor
    networks:
      - nexdeploy-public
      - nexdeploy-internal

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN}
      PROJECTS_DIR: /opt/nexdeploy/projects
      PROJECTS_VOLUME: ${PROJECTS_VOLUME:-nexdeploy_executor-projects}
    volumes:
      - executor-projects:/opt/nexdeploy/projects
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexdeploy-internal

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NEXDEPLOY_POSTGRES_DB:-nexdeploy}
      POSTGRES_USER: ${NEXDEPLOY_POSTGRES_USER:-nexdeploy_admin}
      POSTGRES_PASSWORD: ${NEXDEPLOY_POSTGRES_PASSWORD:?NEXDEPLOY_POSTGRES_PASSWORD is required in .env}
    volumes:
      - nexdeploy-postgres-data:/var/lib/postgresql/data
    networks:
      - nexdeploy-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  panel-state:
  executor-projects:
  nexdeploy-postgres-data:

networks:
  nexdeploy-public:
    driver: bridge

  nexdeploy-internal:
    internal: true
